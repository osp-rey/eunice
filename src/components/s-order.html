<section
  class="s-order"
  id="s-order"
  style="
    background: url(&quot;@img/order-bg.jpg&quot;) bottom 0 left 0 / cover
      no-repeat;
  "
>
  <div class="container">
    <div class="s-order__wrap">
      <div class="s-order__main">
        <h2 class="s-title s-order__title">Заказать консультацию</h2>
        <div class="content-box s-order__content">
          <p>Оставьте заявку и мы перезвоним вам в ближайшее время</p>
        </div>
        <div class="s-order__adv">
          <div class="s-order__adv-item">
            <div class="item-circle">
              <img src="@img/gift.svg" alt="icon" />
            </div>
            <span>Ответим в течение 15 минут</span>
          </div>
          <div class="s-order__adv-item">
            <div class="item-circle">
              <img src="@img/gift.svg" alt="icon" />
            </div>
            <span>Подбор решения бесплатно</span>
          </div>
        </div>
      </div>
      <div class="s-order__form-wrap">
        <form action="#" class="s-order__form">
          <div class="form-grid">
            <div class="form-control">
              <div class="control-wrap">
                <div class="control-window">
                  <i class="icon-people"></i>
                </div>
                <input type="text" placeholder="Имя" class="input" />
              </div>
            </div>
            <div class="form-control">
              <div class="control-wrap">
                <div class="control-window">
                  <i class="icon-outline-tel"></i>
                </div>
                <input type="tel" placeholder="Номер телефона" class="input" />
              </div>
            </div>
            <div class="form-control">
              <div class="select">
                <div class="select-btn">
                  <div class="control-wrap">
                    <div class="control-window">
                      <i class="icon-box"></i>
                    </div>
                    <input
                      type="text"
                      readonly
                      placeholder="Интересующая продукция"
                      class="input select-input"
                    />
                  </div>
                  <i class="icon-bottom select-arrow"></i>
                </div>
                <div class="select-body">
                  <div class="select-item">Значение 1</div>
                  <div class="select-item">Значение 2</div>
                  <div class="select-item">Значение 3</div>
                  <div class="select-item">Значение 4</div>
                </div>
              </div>
            </div>
            <div class="form-control">
              <div class="check-wrap">
                <span
                  class="wpcf7-form-control-wrap"
                  data-name="acceptance-343"
                >
                  <span class="wpcf7-form-control wpcf7-acceptance">
                    <span class="wpcf7-list-item">
                      <label>
                        <input
                          type="checkbox"
                          name="acceptance-343"
                          value="1"
                          aria-invalid="false"
                        />
                        <span class="wpcf7-list-item-label">
                          <span>
                            Я соглашаюсь с
                            <a href="/personal-data/" target="_blank">
                              Правилами обработки персональных данных
                            </a>
                          </span>
                        </span>
                      </label>
                    </span>
                  </span>
                </span>
              </div>
            </div>
            <button class="btn-s" type="submit">Оставить заявку</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
